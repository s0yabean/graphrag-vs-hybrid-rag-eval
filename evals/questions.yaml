# Retrieval eval questions for the SYNTHETIC sample vault (sample_vault/). See evals/README.md for the categories
# and writing rules. These are not the 47 questions behind the published results; those were written from private
# notes and are not in this repo.
#
# Fields
#   id          unique, e.g. fw-multi-02
#   category    single_fact | multi_hop | entity_rollup | temporal | modality_trap |
#               broad_theme | paraphrase_alias | disambiguation | unanswerable
#   split       dev | test
#   status      draft | approved   (only approved questions are scored)
#   scope       vault-relative folder both methods search ("" = the whole vault)
#   question    worded the way you would really ask it, not copied from the note
#   gold        notes that hold the evidence (vault-relative paths)
#                 grade 2 = essential, 1 = supporting, or a distractor when `why` starts with "distractor"
#   key_facts   atomic facts a correct answer must state; quote = exact text from a gold note (validate.py checks it)
#   expected    a short model answer, for a later answer-level judge
#   traps       unanswerable only: decoy values in the notes (plans, AI advice) that must not be reported as fact

- id: fw-single-01
  category: single_fact
  split: dev
  status: approved
  scope: ""
  question: How much grant money did the roastery get from the local business fund, and what was it for?
  gold:
  - path: Funding/Port Alder Small Business Fund grant.md
    grade: 2
  - path: Operations/Roasting equipment.md
    grade: 1
  key_facts:
  - fact: The grant was $15,000.
    modality: fact
    quote: Grant of $15,000 from the Port Alder Small Business Fund
  - fact: It paid for an afterburner on the roaster.
    modality: fact
    quote: to fit an afterburner to the roaster
  expected: $15,000 from the Port Alder Small Business Fund, awarded in October 2025, to fit an afterburner.

